<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de projetores</title>
</head>

<body>
    <header>
        <h1>
            Reserva de projetores
        </h1>
        <p>Gerenciamento de equipamento escolar</p>
    </header>
    <main>
        <section>
            <h2>
                tabela de horarios
            </h2>
            <table>
                </thead>
                <tbody>
                    <tr>
                        <th>
                        <td>Dias</td>
                        <td>Horarios</td>
                        <td>Turma</td>
                        <td>Professor</td>
                        </th>
                    </tr>
                </tbody>
                </thead>
            </table>
        </section>

        <aside>
            <h2>
            Cadastre sua Reservas
            </h2>
            <form action="">
                <label for="">Nome do professor</label>
                <input type="text" name="nome do professor" id="">

                <label for="">Turma</label>
                <input type="text" name="turma" id="">

                <label for="">Data</label>
                <input type="date" name="data" id="">

                <label for="">Horario</label>
                <input type="time" name="horario" id="">

                <select name="" id="">
                    <option value="">Projetor 1</option>
                    <option value="">Projetor 2</option>
                    <option value="">TV</option>
                </select>
                <button type="submit">reservar</button>



            </form>

        </aside>
    </main>
    <footer>
        <p>
            direitos de reservamentos | 2ºserie | Renan , jorge , lukas
        </p>
    </footer>



</body>

</html>
